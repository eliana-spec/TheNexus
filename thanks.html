<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in! | Rise! I — The Nexus School</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --plum-deep: #4E0A6B;
    --plum-navy: #1c0f36;
    --magenta: #AE4382;
    --pink-soft: #F4DDF0;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    background: var(--plum-navy);
    -webkit-font-smoothing: antialiased;
  }
  .container-narrow { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  /* Hero (matches the landing page) */
  .hero {
    flex: 1;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, var(--plum-navy) 0%, var(--plum-deep) 55%, var(--magenta) 100%);
    color: var(--white);
    padding: 120px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(216, 120, 193, 0.2) 0%, transparent 55%);
    pointer-events: none;
  }
  .hero > * { position: relative; z-index: 1; width: 100%; }
  .eyebrow {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pink-soft);
    margin-bottom: 1.5rem;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.8rem, 7vw, 4.6rem);
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 1.6rem;
  }
  .subhead {
    font-size: clamp(1.05rem, 1.9vw, 1.25rem);
    line-height: 1.55;
    font-weight: 300;
    max-width: 560px;
    margin: 0 auto 2.5rem;
  }
  .btn {
    display: inline-block;
    padding: 16px 40px;
    border-radius: 40px;
    border: 2px solid var(--white);
    background: var(--white);
    color: var(--plum-deep);
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: all 0.25s ease;
  }
  .btn:hover { background: transparent; color: var(--white); }

  footer {
    background: var(--plum-navy);
    color: rgba(255,255,255,0.7);
    padding: 40px 0;
    text-align: center;
    font-size: 0.9rem;
  }
  footer a { color: var(--pink-soft); text-decoration: none; }
</style>
</head>
<body>

<section class="hero">
  <div class="container-narrow">
    <span class="eyebrow">Rise! I Waitlist</span>
    <h1>You're in!</h1>
    <p class="subhead">We'll let you know when early enrolment opens to Rise!.</p>
    <a href="/" class="btn">Back to the Rise! page</a>
  </div>
</section>

<footer>
  <div class="container-narrow">
    <p>© 2026 The Nexus School · <a href="mailto:info@thenexus.org">info@thenexus.org</a></p>
  </div>
</footer>

</body>
</html>
